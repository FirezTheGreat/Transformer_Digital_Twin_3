services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: transformer_dt_backend
    ports:
      - "8000:8000"
    environment:
      - "APP_ENV=production"
      - "DB_PATH=:memory:"
      - "DEFAULT_ASSET_ID=TX_1000_COMM"
      - "PARQUET_DIR=/app/data/processed"
      - "CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000"
    volumes:
      - ./data:/app/data:ro
      - ./fixtures:/app/fixtures:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: transformer_dt_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
